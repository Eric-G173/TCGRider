name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tests
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --configuration Release

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22' # Electron 42+ requires Node >=22.12.0
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watchAll=false

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    # NOTE: this job's first sync of any never-before-tested set is a real
    # live call to TCGdex — CI always starts with an empty database, no way
    # around that. We've directly experienced TCGdex having real, multi-day
    # outages this project. If this job ever fails specifically waiting on
    # the "Jungle" tracker button (not the earlier setup steps), that's the
    # likely cause, not a real regression — worth checking
    # https://tcgdex.dev/status before assuming the app broke.
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore and build backend
        working-directory: backend
        run: |
          dotnet restore
          dotnet build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: backend
        run: nohup dotnet bin/Debug/net10.0/TCGRider.Api.dll > /tmp/backend.log 2>&1 &
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Start frontend
        working-directory: frontend
        run: nohup npm start > /tmp/frontend.log 2>&1 &

      
      - name: Wait for both servers to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/ping > /dev/null; then
              echo "Backend is up (attempt $i)"
              break
            fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then
              echo "Frontend is up (attempt $i)"
              break
            fi
            sleep 2
          done

      - name: Dump backend/frontend logs if the wait above failed
        if: failure()
        run: |
          echo "=== backend.log ==="
          cat /tmp/backend.log || echo "(no backend.log found)"
          echo "=== frontend.log ==="
          cat /tmp/frontend.log || echo "(no frontend.log found)"

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30